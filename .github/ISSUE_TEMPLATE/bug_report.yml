name: Bug report
description: Report a problem with FreeLingo.
body:
  - type: markdown
    attributes:
      value: Please write the issue title and your answers in English. Keep quoted error messages and logs in their original language.
  - type: textarea
    id: description
    attributes:
      label: Problem description
      description: Describe the problem and where it occurs.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: List the steps that lead to the problem, or describe what you were doing if it is intermittent.
      placeholder: |
        1. Go to...
        2. Select...
        3. Observe...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What did you expect to happen?
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: What happened instead? Include any visible error message.
    validations:
      required: true
  - type: dropdown
    id: environment
    attributes:
      label: Environment
      options:
        - Hosted service (freelingo.app)
        - Self-hosted deployment
        - Local development
        - Other / unknown
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: FreeLingo version or commit
      description: If known, include the application version, image tag, or commit hash.
  - type: input
    id: browser
    attributes:
      label: Browser and operating system
      description: If relevant, include browser version, operating system, and device type.
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Optional screenshots, relevant logs, or other details. For language-specific problems, include the interface language and the language being learned.
